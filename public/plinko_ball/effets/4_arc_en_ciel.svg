<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<clipPath id="bille"><circle cx="500" cy="500" r="500"/></clipPath>
<radialGradient id="volume" cx="420" cy="380" r="640" gradientUnits="userSpaceOnUse">
  <stop offset="0.5" stop-color="black" stop-opacity="0"/><stop offset="1" stop-color="black" stop-opacity="0.5"/>
</radialGradient>
<radialGradient id="reflet" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="white" stop-opacity="0.85"/><stop offset="1" stop-color="white" stop-opacity="0"/>
</radialGradient>

</defs>
<g id="bille-arc_en_ciel" clip-path="url(#bille)">
<g id="surface">
  <rect x="-300" y="-100" width="1600" height="200" fill="#ff3b3b" transform="rotate(-30 500 500)"/>
  <rect x="-300" y="100" width="1600" height="200" fill="#ff9a1f" transform="rotate(-30 500 500)"/>
  <rect x="-300" y="300" width="1600" height="200" fill="#ffe11f" transform="rotate(-30 500 500)"/>
  <rect x="-300" y="500" width="1600" height="200" fill="#3bd16f" transform="rotate(-30 500 500)"/>
  <rect x="-300" y="700" width="1600" height="200" fill="#2f8cff" transform="rotate(-30 500 500)"/>
  <rect x="-300" y="900" width="1600" height="200" fill="#8a4dff" transform="rotate(-30 500 500)"/>
</g>
<g id="ombrage">
  <circle cx="500" cy="500" r="500" fill="url(#volume)"/>
  <ellipse cx="340" cy="290" rx="170" ry="120" fill="url(#reflet)" opacity="0.9" transform="rotate(-35 340 290)"/>
</g>
</g>
</svg>
