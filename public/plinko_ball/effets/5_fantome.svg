<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<clipPath id="bille"><circle cx="500" cy="500" r="500"/></clipPath>
<radialGradient id="volume" cx="420" cy="380" r="640" gradientUnits="userSpaceOnUse">
  <stop offset="0.5" stop-color="black" stop-opacity="0"/><stop offset="1" stop-color="black" stop-opacity="0.5"/>
</radialGradient>
<radialGradient id="reflet" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="white" stop-opacity="0.85"/><stop offset="1" stop-color="white" stop-opacity="0"/>
</radialGradient>

</defs>
<g id="bille-fantome" clip-path="url(#bille)">
<g id="surface">
  <circle cx="500" cy="500" r="500" fill="#eef1ff" fill-opacity="0.55"/>
  <ellipse cx="380" cy="440" rx="60" ry="90" fill="#1d2140" fill-opacity="0.7"/>
  <ellipse cx="620" cy="440" rx="60" ry="90" fill="#1d2140" fill-opacity="0.7"/>
  <ellipse cx="500" cy="680" rx="60" ry="80" fill="#1d2140" fill-opacity="0.6"/>
</g>
<g id="ombrage">
  <circle cx="500" cy="500" r="500" fill="url(#volume)"/>
  <ellipse cx="340" cy="290" rx="170" ry="120" fill="url(#reflet)" opacity="0.5" transform="rotate(-35 340 290)"/>
</g>
</g>
</svg>
